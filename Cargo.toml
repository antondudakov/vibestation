[package]
name = "vibestation"
version = "1.1.1"
edition = "2021"
description = "One picker for your tmux sessions and git projects"
license = "MIT"
repository = "https://github.com/bwdude/vibestation"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The version inquire already pulls, so naming it costs nothing to build.
crossterm = "0.25"
inquire = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
walkdir = "2"

[profile.release]
strip = true
