[package]
name = "vibestation"
version = "1.6.0"
edition = "2021"
description = "One picker for your tmux sessions and git projects"
license = "MIT"
repository = "https://github.com/bwdude/vibestation"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The terminal every prompt is drawn on.
crossterm = "0.25"
# The scorer the picker filters its rows with.
fuzzy-matcher = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
walkdir = "2"

[profile.release]
strip = true
